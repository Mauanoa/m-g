<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moto Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1410;
    --bg2: #241e18;
    --bg3: #2e2620;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.15);
    --accent: #e8a020;
    --accent2: #c47d10;
    --text: #f0e8d8;
    --text2: #a09080;
    --green: #5a9e3a;
    --green-bg: rgba(90,158,58,0.15);
    --red: #c04040;
    --red-bg: rgba(192,64,64,0.15);
    --amber: #c47d10;
    --amber-bg: rgba(196,125,16,0.15);
    --radius: 10px;
    --radius-lg: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }

  /* HEADER */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .header-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: var(--accent);
  }
  .header-money {
    background: var(--green-bg);
    color: #7ed45a;
    font-size: 15px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(90,158,58,0.3);
  }

  /* SCREENS */
  .screen { display: none; padding: 16px 20px 40px; }
  .screen.active { display: block; }

  /* STATS */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 600; color: var(--text); }

  /* SECTION TITLE */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  /* MOTO CARDS */
  .moto-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .moto-card:hover { border-color: var(--border2); background: var(--bg3); }
  .moto-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
  .moto-name { font-size: 16px; font-weight: 600; color: var(--text); }
  .moto-year { font-size: 12px; color: var(--text2); margin-top: 1px; }
  .moto-client { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .moto-issue { font-size: 13px; color: var(--text); margin: 10px 0 8px; line-height: 1.4; }
  .moto-reward { font-size: 12px; color: var(--accent); font-weight: 600; }

  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .badge-urgent { background: var(--red-bg); color: #e06060; border: 1px solid rgba(192,64,64,0.3); }
  .badge-normal { background: var(--green-bg); color: #7ed45a; border: 1px solid rgba(90,158,58,0.3); }
  .badge-waiting { background: var(--amber-bg); color: #f0a030; border: 1px solid rgba(196,125,16,0.3); }

  .progress-bar {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    margin-top: 10px;
    overflow: hidden;
  }
  .progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }

  .rep-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .rep-tag {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    background: var(--green-bg);
    color: #7ed45a;
    border: 1px solid rgba(90,158,58,0.2);
  }

  /* BUTTONS */
  .btn {
    display: block;
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: var(--bg3);
    color: var(--text);
    text-align: center;
    transition: background 0.15s, border-color 0.15s;
    margin-bottom: 10px;
    font-family: 'DM Sans', sans-serif;
  }
  .btn:hover { background: #3a2e24; border-color: var(--accent); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent2); color: #fff; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: var(--accent); }
  .btn-back { background: transparent; border-color: var(--border); color: var(--text2); }
  .btn-back:hover { border-color: var(--border2); color: var(--text); background: transparent; }

  /* REPAIR SCREEN */
  .repair-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
  }
  .moto-big { font-size: 20px; font-weight: 700; color: var(--text); }
  .repair-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    background: var(--bg2);
  }
  .repair-name { font-size: 14px; color: var(--text); }
  .repair-price { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .repair-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .repair-btn-todo { background: var(--accent2); color: white; border: none; }
  .repair-btn-todo:hover { background: var(--accent); }
  .repair-btn-done { background: var(--green-bg); color: #7ed45a; border: 1px solid rgba(90,158,58,0.3); cursor: default; }

  .reward-banner {
    background: var(--green-bg);
    border: 1px solid rgba(90,158,58,0.3);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 16px;
  }
  .reward-title { font-size: 15px; font-weight: 600; color: #7ed45a; }
  .reward-sub { font-size: 13px; color: #5a9e3a; margin-top: 2px; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }

  /* SHOP */
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 8px;
    background: var(--bg2);
  }
  .shop-name { font-size: 14px; color: var(--text); }
  .shop-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .shop-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    background: var(--accent2);
    color: white;
    border: none;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .shop-btn:hover { background: var(--accent); }

  /* EMPTY STATE */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text2);
    font-size: 14px;
    line-height: 1.7;
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #2e2620;
    border: 1px solid var(--border2);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 200;
    max-width: 90vw;
  }

  /* SUCCESS SCREEN */
  .success-screen {
    text-align: center;
    padding: 30px 0;
  }
  .success-icon { font-size: 56px; margin-bottom: 14px; }
  .success-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; }
  .success-sub { font-size: 14px; color: var(--text2); margin-bottom: 24px; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">🏍 Moto Garage</span>
  <span class="header-money" id="money-display">1 200 €</span>
</div>

<!-- GARAGE -->
<div id="screen-garage" class="screen active">
  <div class="stat-grid" style="margin-top:4px">
    <div class="stat-card">
      <div class="stat-label">En cours</div>
      <div class="stat-value" id="stat-encours">3</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Réparées</div>
      <div class="stat-value" id="stat-done">2</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Réputation</div>
      <div class="stat-value" id="stat-rep">⭐ 4.5</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Niveau atelier</div>
      <div class="stat-value" id="stat-level">1</div>
    </div>
  </div>
  <div class="section-title">Motos à réparer</div>
  <div id="moto-list"></div>
  <div class="divider"></div>
  <button class="btn" onclick="openShop()">🛒 Boutique de pièces</button>
</div>

<!-- REPAIR -->
<div id="screen-repair" class="screen">
  <div id="reward-banner" class="reward-banner" style="display:none">
    <div class="reward-title" id="reward-title"></div>
    <div class="reward-sub" id="reward-sub"></div>
  </div>
  <div id="repair-content"></div>
</div>

<!-- SHOP -->
<div id="screen-shop" class="screen">
  <div class="section-title" style="margin-top:4px">Pièces disponibles</div>
  <div id="shop-list"></div>
  <div class="divider"></div>
  <button class="btn btn-back" onclick="showScreen('garage')">← Retour au garage</button>
</div>

<div id="toast" class="toast"></div>

<script>
const state = {
  money: 1200,
  done: 2,
  reputation: 4.5,
  level: 1,
  motos: [
    {
      id: 1,
      name: "Honda CB750",
      year: "1978",
      client: "Marc D.",
      issue: "Ne démarre plus, fuite d'huile",
      urgency: "urgent",
      reward: 320,
      repairs: [
        { id: "carbu", name: "Nettoyer le carburateur", price: 40, done: false },
        { id: "huile", name: "Changer le joint d'huile", price: 25, done: false },
        { id: "bat", name: "Remplacer la batterie", price: 60, done: true },
      ]
    },
    {
      id: 2,
      name: "Kawasaki Z400",
      year: "1982",
      client: "Sophie L.",
      issue: "Freins usés, pneu arrière à plat",
      urgency: "normal",
      reward: 210,
      repairs: [
        { id: "frein", name: "Plaquettes de frein", price: 45, done: false },
        { id: "pneu", name: "Changer pneu arrière", price: 80, done: false },
      ]
    },
    {
      id: 3,
      name: "Yamaha XS650",
      year: "1975",
      client: "Pierre M.",
      issue: "Révision complète demandée",
      urgency: "waiting",
      reward: 450,
      repairs: [
        { id: "filtre", name: "Changer filtre à air", price: 20, done: false },
        { id: "bougies", name: "Remplacer les bougies", price: 30, done: false },
        { id: "chaine", name: "Régler la chaîne", price: 25, done: false },
        { id: "huile2", name: "Vidange complète", price: 50, done: false },
      ]
    }
  ],
  shop: [
    { id: "carbu", name: "Carburateur universel", price: 95, owned: 2 },
    { id: "piston", name: "Kit pistons", price: 140, owned: 0 },
    { id: "allumage", name: "Bobine d'allumage", price: 55, owned: 1 },
    { id: "fourche", name: "Joint de fourche", price: 30, owned: 3 },
    { id: "chrome", name: "Kit chromage déco", price: 200, owned: 0 },
  ]
};

function $(id) { return document.getElementById(id); }

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}

function updateHeader() {
  $('money-display').textContent = state.money.toLocaleString('fr-FR') + ' €';
  $('stat-encours').textContent = state.motos.length;
  $('stat-done').textContent = state.done;
  $('stat-rep').textContent = '⭐ ' + state.reputation;
  $('stat-level').textContent = state.level;
}

function urgencyBadge(u) {
  if (u === 'urgent') return '<span class="badge badge-urgent">Urgent</span>';
  if (u === 'normal') return '<span class="badge badge-normal">Normal</span>';
  return '<span class="badge badge-waiting">En attente</span>';
}

function renderGarage() {
  const list = $('moto-list');
  if (state.motos.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🏆</div>Aucune moto en cours.<br>Ton atelier est libre !</div>';
    return;
  }
  list.innerHTML = state.motos.map(m => {
    const total = m.repairs.length;
    const done = m.repairs.filter(r => r.done).length;
    const pct = Math.round((done / total) * 100);
    const color = pct === 100 ? '#5a9e3a' : pct > 50 ? '#c47d10' : '#378add';
    const doneTags = m.repairs.filter(r => r.done).map(r => `<span class="rep-tag">${r.name}</span>`).join('');
    return `
      <div class="moto-card" onclick="openRepair(${m.id})">
        <div class="moto-top">
          <div>
            <div class="moto-name">${m.name}</div>
            <div class="moto-year">${m.year} · Client : ${m.client}</div>
          </div>
          ${urgencyBadge(m.urgency)}
        </div>
        <div class="moto-issue">${m.issue}</div>
        <div class="moto-reward">Récompense : ${m.reward} €</div>
        ${doneTags ? `<div class="rep-tags">${doneTags}</div>` : ''}
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%; background:${color}"></div></div>
        <div style="font-size:11px; color:var(--text2); margin-top:5px">${done}/${total} tâches effectuées · ${pct}%</div>
      </div>
    `;
  }).join('');
}

function openRepair(id) {
  const moto = state.motos.find(m => m.id === id);
  if (!moto) return;
  $('reward-banner').style.display = 'none';
  renderRepair(moto);
  showScreen('repair');
}

function renderRepair(moto) {
  const total = moto.repairs.length;
  const done = moto.repairs.filter(r => r.done).length;
  const allDone = done === total;

  $('repair-content').innerHTML = `
    <div class="repair-header">
      <div>
        <div class="moto-big">${moto.name}</div>
        <div style="font-size:12px; color:var(--text2); margin-top:3px">${moto.year} · ${moto.client}</div>
      </div>
      ${urgencyBadge(moto.urgency)}
    </div>
    <div style="font-size:13px; color:var(--text2); margin-bottom:16px; line-height:1.5">${moto.issue}</div>
    <div class="section-title">Tâches à effectuer</div>
    <div id="repair-tasks">
      ${moto.repairs.map(r => `
        <div class="repair-item">
          <div>
            <div class="repair-name" style="${r.done ? 'text-decoration:line-through; opacity:0.5' : ''}">${r.name}</div>
            <div class="repair-price">Coût : ${r.price} €</div>
          </div>
          ${r.done
            ? '<button class="repair-btn repair-btn-done" disabled>✓ Fait</button>'
            : `<button class="repair-btn repair-btn-todo" onclick="doRepair(${moto.id},'${r.id}')">Réparer</button>`
          }
        </div>
      `).join('')}
    </div>
    <div class="divider"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px">
      <span style="font-size:14px; color:var(--text2)">Récompense client</span>
      <span style="font-size:17px; font-weight:700; color:var(--accent)">${moto.reward} €</span>
    </div>
    ${allDone
      ? `<button class="btn btn-primary" onclick="completeMoto(${moto.id})">✓ Rendre la moto au client</button>`
      : `<button class="btn" disabled>Terminer toutes les tâches d'abord</button>`
    }
    <button class="btn btn-back" onclick="showScreen('garage'); renderGarage()">← Retour au garage</button>
  `;
}

function doRepair(motoId, repairId) {
  const moto = state.motos.find(m => m.id === motoId);
  const repair = moto.repairs.find(r => r.id === repairId);
  if (!repair || repair.done) return;
  if (state.money < repair.price) { toast('Pas assez d\'argent !'); return; }
  state.money -= repair.price;
  repair.done = true;
  updateHeader();
  renderRepair(moto);
  toast('✓ ' + repair.name + ' effectué !');
}

function completeMoto(motoId) {
  const moto = state.motos.find(m => m.id === motoId);
  if (!moto) return;
  state.money += moto.reward;
  state.done += 1;
  state.reputation = Math.min(5, parseFloat((state.reputation + 0.05).toFixed(2)));
  if (state.done % 5 === 0) state.level += 1;
  state.motos = state.motos.filter(m => m.id !== motoId);
  updateHeader();

  $('reward-title').textContent = '🎉 ' + moto.name + ' rendue !';
  $('reward-sub').textContent = '+' + moto.reward + ' € encaissés · Réputation : ⭐ ' + state.reputation;
  $('reward-banner').style.display = 'block';

  $('repair-content').innerHTML = `
    <div class="success-screen">
      <div class="success-icon">🏆</div>
      <div class="success-title">Réparation terminée !</div>
      <div class="success-sub">La ${moto.name} est rendue à ${moto.client}.<br>Belle réputation !</div>
      <button class="btn btn-primary" style="max-width:240px; margin:0 auto" onclick="showScreen('garage'); renderGarage()">Retour au garage</button>
    </div>
  `;
}

function openShop() {
  const list = $('shop-list');
  list.innerHTML = state.shop.map(item => `
    <div class="shop-item">
      <div>
        <div class="shop-name">${item.name}</div>
        <div class="shop-meta">${item.price} € · En stock : ${item.owned}</div>
      </div>
      <button class="shop-btn" onclick="buyPart('${item.id}')">Acheter</button>
    </div>
  `).join('');
  showScreen('shop');
}

function buyPart(id) {
  const item = state.shop.find(s => s.id === id);
  if (!item) return;
  if (state.money < item.price) { toast('Pas assez d\'argent !'); return; }
  state.money -= item.price;
  item.owned += 1;
  updateHeader();
  openShop();
  toast('✓ ' + item.name + ' achetée !');
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2200);
}

updateHeader();
renderGarage();
</script>
</body>
</html>
