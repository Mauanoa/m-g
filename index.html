<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1a1410; --bg2: #241e18; --bg3: #2e2620;
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.15);
  --accent: #e8a020; --accent2: #c47d10;
  --text: #f0e8d8; --text2: #a09080;
  --green: #5a9e3a; --green-bg: rgba(90,158,58,0.15);
  --red: #c04040; --red-bg: rgba(192,64,64,0.15);
  --amber-bg: rgba(196,125,16,0.15);
  --radius: 10px; --radius-lg: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; overflow-x: hidden; }

.header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
.header-title { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--accent); }
.header-money { background: var(--green-bg); color: #7ed45a; font-size: 15px; font-weight: 600; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(90,158,58,0.3); }

.tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 57px; z-index: 40; }
.tab { flex: 1; padding: 12px 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: color 0.15s, border-color 0.15s; text-transform: uppercase; letter-spacing: 0.5px; }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.screen { display: none; padding: 16px 20px 40px; }
.screen.active { display: block; }

.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
.stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
.stat-label { font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 600; color: var(--text); }

.section-title { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

.moto-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s; }
.moto-card:hover { border-color: var(--border2); background: var(--bg3); }
.moto-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
.moto-name { font-size: 16px; font-weight: 600; color: var(--text); }
.moto-year { font-size: 12px; color: var(--text2); margin-top: 1px; }
.moto-issue { font-size: 13px; color: var(--text); margin: 10px 0 8px; line-height: 1.4; }
.moto-reward { font-size: 12px; color: var(--accent); font-weight: 600; }

.client-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px; }
.client-card:hover { border-color: var(--border2); }
.client-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.client-name { font-size: 15px; font-weight: 600; color: var(--text); }
.client-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.client-issue { font-size: 13px; color: var(--text); margin: 8px 0; line-height: 1.4; }
.client-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.client-reward { font-size: 13px; color: var(--accent); font-weight: 600; }
.client-tasks { font-size: 12px; color: var(--text2); }

.badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; flex-shrink: 0; }
.badge-urgent { background: var(--red-bg); color: #e06060; border: 1px solid rgba(192,64,64,0.3); }
.badge-normal { background: var(--green-bg); color: #7ed45a; border: 1px solid rgba(90,158,58,0.3); }
.badge-waiting { background: var(--amber-bg); color: #f0a030; border: 1px solid rgba(196,125,16,0.3); }

.progress-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
.rep-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.rep-tag { font-size: 11px; padding: 3px 8px; border-radius: 20px; background: var(--green-bg); color: #7ed45a; border: 1px solid rgba(90,158,58,0.2); }

.btn { display: block; width: 100%; padding: 13px; border: 1px solid var(--border2); border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; background: var(--bg3); color: var(--text); text-align: center; transition: background 0.15s, border-color 0.15s; margin-bottom: 10px; font-family: 'DM Sans', sans-serif; }
.btn:hover { background: #3a2e24; border-color: var(--accent); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary { background: var(--accent2); color: #fff; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { background: var(--accent); }
.btn-back { background: transparent; border-color: var(--border); color: var(--text2); }
.btn-back:hover { border-color: var(--border2); color: var(--text); background: transparent; }
.accept-btn { font-size: 13px; font-weight: 600; padding: 8px 18px; border-radius: 20px; cursor: pointer; background: var(--accent2); color: white; border: none; font-family: 'DM Sans', sans-serif; transition: background 0.15s; }
.accept-btn:hover { background: var(--accent); }
.accept-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }

.repair-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; background: var(--bg2); }
.repair-name { font-size: 14px; color: var(--text); }
.repair-price { font-size: 12px; color: var(--text2); margin-top: 2px; }
.repair-btn { font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 20px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.15s; flex-shrink: 0; }
.repair-btn-todo { background: var(--accent2); color: white; border: none; }
.repair-btn-todo:hover { background: var(--accent); }
.repair-btn-done { background: var(--green-bg); color: #7ed45a; border: 1px solid rgba(90,158,58,0.3); cursor: default; }

.reward-banner { background: var(--green-bg); border: 1px solid rgba(90,158,58,0.3); border-radius: var(--radius); padding: 14px; margin-bottom: 16px; }
.reward-title { font-size: 15px; font-weight: 600; color: #7ed45a; }
.reward-sub { font-size: 13px; color: #5a9e3a; margin-top: 2px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }

.shop-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 8px; background: var(--bg2); }
.shop-name { font-size: 14px; color: var(--text); }
.shop-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.shop-btn { font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 20px; cursor: pointer; background: var(--accent2); color: white; border: none; font-family: 'DM Sans', sans-serif; transition: background 0.15s; flex-shrink: 0; }
.shop-btn:hover { background: var(--accent); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; line-height: 1.7; }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.atelier-full { background: var(--amber-bg); border: 1px solid rgba(196,125,16,0.3); border-radius: var(--radius); padding: 10px 14px; font-size: 12px; color: #f0a030; text-align: center; margin-bottom: 12px; }

.success-screen { text-align: center; padding: 30px 0; }
.success-icon { font-size: 56px; margin-bottom: 14px; }
.success-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 2px; color: var(--accent); margin-bottom: 6px; }
.success-sub { font-size: 14px; color: var(--text2); margin-bottom: 24px; }

.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #2e2620; border: 1px solid var(--border2); color: var(--text); padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; z-index: 200; max-width: 90vw; }

/* Moto illustration */
.moto-illustration { background: var(--bg3); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
.moto-illustration svg { width: 100%; max-width: 300px; height: auto; }

/* ===== MINI-JEU OVERLAY ===== */
.minigame-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85);
  z-index: 100; display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.minigame-box {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 20px; padding: 24px; width: 100%; max-width: 400px;
  text-align: center;
}
.mg-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; color: var(--accent); margin-bottom: 4px; }
.mg-sub { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
.mg-result { font-size: 15px; font-weight: 600; margin: 12px 0; min-height: 24px; }
.mg-result.success { color: #7ed45a; }
.mg-result.fail { color: #e06060; }

/* Mini-jeu 1 : Timing */
.timing-bar-wrap { background: var(--bg3); border-radius: 20px; height: 28px; position: relative; overflow: hidden; margin: 16px 0; border: 1px solid var(--border2); cursor: pointer; }
.timing-zone { position: absolute; top: 0; height: 100%; background: rgba(90,158,58,0.4); border-left: 2px solid #7ed45a; border-right: 2px solid #7ed45a; }
.timing-cursor { position: absolute; top: 0; width: 4px; height: 100%; background: var(--accent); border-radius: 2px; transition: none; }
.timing-tap-btn { background: var(--accent2); color: white; border: none; border-radius: var(--radius); padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; font-family: 'DM Sans', sans-serif; margin-top: 8px; }
.timing-tap-btn:active { background: var(--accent); transform: scale(0.97); }

/* Mini-jeu 2 : Trouver la pièce */
.parts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 16px 0; }
.part-option { background: var(--bg3); border: 2px solid var(--border); border-radius: var(--radius); padding: 14px 10px; cursor: pointer; transition: border-color 0.15s, background 0.15s; font-size: 13px; color: var(--text); }
.part-option:hover { border-color: var(--accent); }
.part-option.correct { border-color: #7ed45a; background: var(--green-bg); color: #7ed45a; }
.part-option.wrong { border-color: #e06060; background: var(--red-bg); color: #e06060; }
.part-option .part-emoji { font-size: 28px; margin-bottom: 6px; }

/* Mini-jeu 3 : Ordre */
.order-slots { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
.order-slot { background: var(--bg3); border: 2px dashed var(--border2); border-radius: var(--radius); padding: 12px; font-size: 13px; color: var(--text2); min-height: 46px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: border-color 0.15s; }
.order-slot.filled { border-style: solid; border-color: var(--accent2); color: var(--text); background: rgba(196,125,16,0.1); }
.order-slot.correct-slot { border-color: #7ed45a; background: var(--green-bg); color: #7ed45a; }
.order-slot.wrong-slot { border-color: #e06060; background: var(--red-bg); color: #e06060; }
.order-pieces { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; justify-content: center; }
.order-piece { background: var(--accent2); color: white; border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: opacity 0.15s; }
.order-piece:disabled { opacity: 0.3; cursor: default; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">🏍 Moto Garage</span>
  <span class="header-money" id="money-display">1 200 €</span>
</div>

<div class="tabs" id="main-tabs">
  <div class="tab active" onclick="switchTab('garage', this)">🔧 Atelier</div>
  <div class="tab" onclick="switchTab('clients', this)">👥 Clients</div>
  <div class="tab" onclick="switchTab('shop', this)">🛒 Boutique</div>
</div>

<div id="screen-garage" class="screen active">
  <div class="stat-grid" style="margin-top:4px">
    <div class="stat-card"><div class="stat-label">En cours</div><div class="stat-value" id="stat-encours">0</div></div>
    <div class="stat-card"><div class="stat-label">Réparées</div><div class="stat-value" id="stat-done">0</div></div>
    <div class="stat-card"><div class="stat-label">Réputation</div><div class="stat-value" id="stat-rep">⭐ 4.5</div></div>
    <div class="stat-card"><div class="stat-label">Capacité</div><div class="stat-value" id="stat-capa">0/3</div></div>
  </div>
  <div class="section-title">Motos dans l'atelier</div>
  <div id="moto-list"></div>
</div>

<div id="screen-clients" class="screen">
  <div style="margin-top:4px; margin-bottom:12px; font-size:13px; color:var(--text2); line-height:1.5">Choisis les clients à accepter. De nouveaux arrivent régulièrement !</div>
  <div id="atelier-full-banner" class="atelier-full" style="display:none">⚠️ Atelier plein ! Rends une moto pour libérer une place.</div>
  <div class="section-title">Clients en attente</div>
  <div id="client-list"></div>
  <button class="btn btn-back" style="margin-top:8px" onclick="refreshClients()">🔄 Actualiser les clients</button>
</div>

<div id="screen-repair" class="screen">
  <div id="reward-banner" class="reward-banner" style="display:none">
    <div class="reward-title" id="reward-title"></div>
    <div class="reward-sub" id="reward-sub"></div>
  </div>
  <div id="repair-content"></div>
</div>

<div id="screen-shop" class="screen">
  <div class="section-title" style="margin-top:4px">Pièces disponibles</div>
  <div id="shop-list"></div>
</div>

<div id="toast" class="toast"></div>
<div id="minigame-overlay" class="minigame-overlay" style="display:none">
  <div class="minigame-box" id="minigame-box"></div>
</div>

<script>
// ==============================
// ILLUSTRATIONS SVG DES MOTOS
// ==============================
function drawMoto(color1, color2) {
  return `<svg viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg">
    <!-- Sol -->
    <line x1="20" y1="120" x2="300" y2="120" stroke="#3a3020" stroke-width="2"/>
    <!-- Roue arrière -->
    <circle cx="80" cy="110" r="28" fill="none" stroke="#555" stroke-width="8"/>
    <circle cx="80" cy="110" r="14" fill="#333" stroke="#444" stroke-width="3"/>
    <circle cx="80" cy="110" r="4" fill="#888"/>
    <!-- Roue avant -->
    <circle cx="240" cy="110" r="28" fill="none" stroke="#555" stroke-width="8"/>
    <circle cx="240" cy="110" r="14" fill="#333" stroke="#444" stroke-width="3"/>
    <circle cx="240" cy="110" r="4" fill="#888"/>
    <!-- Fourche avant -->
    <line x1="215" y1="55" x2="240" y2="108" stroke="#666" stroke-width="5" stroke-linecap="round"/>
    <line x1="225" y1="55" x2="248" y2="108" stroke="#666" stroke-width="5" stroke-linecap="round"/>
    <!-- Guidon -->
    <line x1="210" y1="52" x2="235" y2="50" stroke="#888" stroke-width="4" stroke-linecap="round"/>
    <circle cx="235" cy="50" r="5" fill="#666"/>
    <!-- Cadre principal -->
    <path d="M80 90 L110 60 L175 55 L215 58 L200 90 Z" fill="${color1}" stroke="#333" stroke-width="2"/>
    <!-- Réservoir -->
    <path d="M120 52 L175 48 L185 55 L175 65 L115 65 Z" fill="${color2}" stroke="#333" stroke-width="1.5"/>
    <!-- Selle -->
    <path d="M110 60 L175 55 L185 62 L175 68 L108 68 Z" fill="#222" stroke="#444" stroke-width="1"/>
    <!-- Carénage -->
    <path d="M80 90 L95 75 L110 70 L108 92 Z" fill="${color1}" stroke="#333" stroke-width="1.5"/>
    <!-- Échappement -->
    <path d="M90 100 Q120 95 150 98 L155 103 Q125 100 95 106 Z" fill="#888" stroke="#666" stroke-width="1"/>
    <!-- Phare avant -->
    <ellipse cx="258" cy="75" rx="10" ry="8" fill="#ffdd88" stroke="#888" stroke-width="2" opacity="0.9"/>
    <!-- Feu arrière -->
    <rect x="62" y="85" width="12" height="8" rx="3" fill="#cc2222" stroke="#991111" stroke-width="1" opacity="0.9"/>
    <!-- Moteur -->
    <rect x="115" y="72" width="50" height="28" rx="4" fill="#444" stroke="#555" stroke-width="1.5"/>
    <rect x="122" y="78" width="12" height="16" rx="2" fill="#555"/>
    <rect x="140" y="78" width="12" height="16" rx="2" fill="#555"/>
    <rect x="158" y="78" width="8" height="16" rx="2" fill="#555"/>
  </svg>`;
}

const MOTO_COLORS = [
  ["#c0392b","#922b21"], ["#1a5276","#154360"], ["#1e8449","#145a32"],
  ["#7d6608","#6e2f02"], ["#6c3483","#512e5f"], ["#2e4053","#1c2833"],
  ["#935116","#6e2c00"], ["#1a252f","#e8a020"],
];

// ==============================
// DONNÉES
// ==============================
const MOTOS_POSSIBLES = [
  "Honda CB750","Kawasaki Z400","Yamaha XS650","Triumph Bonneville",
  "BMW R90S","Ducati 750GT","Norton Commando","Suzuki GS750",
  "Honda CB400F","Moto Guzzi V7",
];
const ANNEES = ["1968","1970","1972","1974","1975","1977","1978","1980","1982","1984"];
const CLIENTS_POSSIBLES = [
  "Marc D.","Sophie L.","Pierre M.","Julie R.","Ahmed K.",
  "Nathalie B.","Thomas G.","Isabelle F.","Karim S.","Laura V.",
  "François T.","Emma C.","Nicolas P.","Céline M.","Romain D.",
];

// Type de mini-jeu assigné à chaque type de réparation
const MINIGAME_TYPES = {
  "carbu": "find",    // Trouver la bonne pièce
  "huile": "timing",  // Timing
  "bat": "timing",
  "frein": "order",   // Ordre
  "pneu": "timing",
  "filtre": "find",
  "bougies": "order",
  "chaine": "order",
  "vidange": "timing",
  "liquide": "find",
  "joint_cul": "order",
  "faisceau": "find",
  "phare": "find",
  "fusible": "find",
  "cable_emb": "timing",
  "boite": "order",
  "joint_fourche": "timing",
  "huile_fourche": "timing",
  "amortis": "order",
  "retro": "find",
  "carross": "order",
};

const PANNES_POSSIBLES = [
  { issue: "Ne démarre plus, fuite d'huile", urgency: "urgent",
    repairs: [{id:"carbu",name:"Nettoyer le carburateur",price:40},{id:"huile",name:"Changer le joint d'huile",price:25},{id:"bat",name:"Remplacer la batterie",price:60}] },
  { issue: "Freins usés, pneu arrière à plat", urgency: "normal",
    repairs: [{id:"frein",name:"Plaquettes de frein",price:45},{id:"pneu",name:"Changer pneu arrière",price:80}] },
  { issue: "Révision complète demandée", urgency: "waiting",
    repairs: [{id:"filtre",name:"Changer filtre à air",price:20},{id:"bougies",name:"Remplacer les bougies",price:30},{id:"chaine",name:"Régler la chaîne",price:25},{id:"vidange",name:"Vidange complète",price:50}] },
  { issue: "Moteur qui chauffe, fumée blanche", urgency: "urgent",
    repairs: [{id:"liquide",name:"Refaire circuit refroidissement",price:55},{id:"joint_cul",name:"Remplacer joint de culasse",price:120}] },
  { issue: "Problème électrique, phare mort", urgency: "normal",
    repairs: [{id:"faisceau",name:"Vérifier faisceau électrique",price:35},{id:"phare",name:"Remplacer le phare",price:50},{id:"fusible",name:"Changer les fusibles",price:10}] },
  { issue: "Transmission grince, embrayage dur", urgency: "waiting",
    repairs: [{id:"cable_emb",name:"Câble d'embrayage",price:30},{id:"boite",name:"Vérifier boîte de vitesses",price:70}] },
  { issue: "Fourche qui fuit, amortisseurs usés", urgency: "normal",
    repairs: [{id:"joint_fourche",name:"Joint de fourche",price:45},{id:"huile_fourche",name:"Huile de fourche",price:20},{id:"amortis",name:"Amortisseurs arrière",price:130}] },
];

// ==============================
// STATE
// ==============================
const state = {
  money: 1200, done: 0, reputation: 4.5, maxCapacity: 3, nextId: 1,
  motos: [], clientsDisponibles: [],
  shop: [
    {id:"carbu",name:"Carburateur universel",price:95,owned:2},
    {id:"piston",name:"Kit pistons",price:140,owned:0},
    {id:"allumage",name:"Bobine d'allumage",price:55,owned:1},
    {id:"fourche",name:"Joint de fourche",price:30,owned:3},
    {id:"chrome",name:"Kit chromage déco",price:200,owned:0},
  ]
};

let currentMinigame = null; // mini-jeu en cours

// ==============================
// UTILITAIRES
// ==============================
function $(id) { return document.getElementById(id); }
function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function calcReward(repairs) {
  const total = repairs.reduce((s,r) => s + r.price, 0);
  return Math.round((total * 2 + 50) / 10) * 10;
}
function genererClient() {
  const panne = rand(PANNES_POSSIBLES);
  const repairs = panne.repairs.map(r => ({...r, done: false}));
  const colors = rand(MOTO_COLORS);
  return {
    id: state.nextId++,
    name: rand(MOTOS_POSSIBLES),
    year: rand(ANNEES),
    client: rand(CLIENTS_POSSIBLES),
    issue: panne.issue,
    urgency: panne.urgency,
    reward: calcReward(repairs),
    repairs,
    colors,
  };
}
function refreshClients() {
  state.clientsDisponibles = [genererClient(), genererClient(), genererClient()];
  renderClients();
  toast('🔄 Nouveaux clients disponibles !');
}

// ==============================
// NAVIGATION
// ==============================
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
  window.scrollTo(0,0);
}
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (name === 'garage') { showScreen('garage'); renderGarage(); }
  else if (name === 'clients') { showScreen('clients'); renderClients(); }
  else if (name === 'shop') { showScreen('shop'); renderShop(); }
}
function goToRepair(id) {
  $('main-tabs').style.display = 'none';
  const moto = state.motos.find(m => m.id === id);
  if (!moto) return;
  $('reward-banner').style.display = 'none';
  renderRepair(moto);
  showScreen('repair');
}
function backToGarage() {
  $('main-tabs').style.display = 'flex';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[0].classList.add('active');
  showScreen('garage');
  renderGarage();
  updateHeader();
}

// ==============================
// AFFICHAGE
// ==============================
function updateHeader() {
  $('money-display').textContent = state.money.toLocaleString('fr-FR') + ' €';
  $('stat-encours').textContent = state.motos.length;
  $('stat-done').textContent = state.done;
  $('stat-rep').textContent = '⭐ ' + state.reputation;
  $('stat-capa').textContent = state.motos.length + '/' + state.maxCapacity;
}
function urgencyBadge(u) {
  if (u==='urgent') return '<span class="badge badge-urgent">Urgent</span>';
  if (u==='normal') return '<span class="badge badge-normal">Normal</span>';
  return '<span class="badge badge-waiting">En attente</span>';
}
function renderGarage() {
  const list = $('moto-list');
  if (!state.motos.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🔧</div>Aucune moto dans l\'atelier.<br>Va dans <b>Clients</b> pour en accepter !</div>';
    return;
  }
  list.innerHTML = state.motos.map(m => {
    const total = m.repairs.length;
    const done = m.repairs.filter(r=>r.done).length;
    const pct = Math.round(done/total*100);
    const color = pct===100?'#5a9e3a':pct>50?'#c47d10':'#378add';
    const tags = m.repairs.filter(r=>r.done).map(r=>`<span class="rep-tag">${r.name}</span>`).join('');
    return `<div class="moto-card" onclick="goToRepair(${m.id})">
      <div class="moto-top"><div><div class="moto-name">${m.name}</div><div class="moto-year">${m.year} · ${m.client}</div></div>${urgencyBadge(m.urgency)}</div>
      <div class="moto-issue">${m.issue}</div>
      <div class="moto-reward">Récompense : ${m.reward} €</div>
      ${tags?`<div class="rep-tags">${tags}</div>`:''}
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${color}"></div></div>
      <div style="font-size:11px;color:var(--text2);margin-top:5px">${done}/${total} tâches · ${pct}%</div>
    </div>`;
  }).join('');
}
function renderClients() {
  const plein = state.motos.length >= state.maxCapacity;
  $('atelier-full-banner').style.display = plein ? 'block' : 'none';
  const list = $('client-list');
  if (!state.clientsDisponibles.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div>Aucun client.<br>Actualise !</div>';
    return;
  }
  list.innerHTML = state.clientsDisponibles.map(c => `
    <div class="client-card">
      <div style="margin-bottom:10px">${drawMoto(c.colors[0], c.colors[1])}</div>
      <div class="client-top"><div><div class="client-name">${c.name}</div><div class="client-sub">${c.year} · ${c.client}</div></div>${urgencyBadge(c.urgency)}</div>
      <div class="client-issue">${c.issue}</div>
      <div class="client-footer"><div><div class="client-reward">+${c.reward} €</div><div class="client-tasks">${c.repairs.length} tâche${c.repairs.length>1?'s':''}</div></div>
      <button class="accept-btn" onclick="accepterClient(${c.id})" ${plein?'disabled':''}>
        ${plein?'Atelier plein':'Accepter'}
      </button></div>
    </div>`).join('');
}
function renderRepair(moto) {
  const total = moto.repairs.length;
  const done = moto.repairs.filter(r=>r.done).length;
  const allDone = done === total;
  $('repair-content').innerHTML = `
    <div class="moto-illustration">${drawMoto(moto.colors[0], moto.colors[1])}</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
      <div><div style="font-size:20px;font-weight:700">${moto.name}</div>
      <div style="font-size:12px;color:var(--text2);margin-top:3px">${moto.year} · ${moto.client}</div></div>
      ${urgencyBadge(moto.urgency)}
    </div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.5">${moto.issue}</div>
    <div class="section-title">Tâches à effectuer</div>
    ${moto.repairs.map(r => `
      <div class="repair-item">
        <div><div class="repair-name" style="${r.done?'text-decoration:line-through;opacity:0.5':''}">${r.name}</div>
        <div class="repair-price">Coût : ${r.price} €</div></div>
        ${r.done
          ? '<button class="repair-btn repair-btn-done" disabled>✓ Fait</button>'
          : `<button class="repair-btn repair-btn-todo" onclick="startMinigame(${moto.id},'${r.id}')">Réparer</button>`}
      </div>`).join('')}
    <div class="divider"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:14px;color:var(--text2)">Récompense client</span>
      <span style="font-size:17px;font-weight:700;color:var(--accent)">${moto.reward} €</span>
    </div>
    ${allDone
      ? `<button class="btn btn-primary" onclick="completeMoto(${moto.id})">✓ Rendre la moto au client</button>`
      : `<button class="btn" disabled>Terminer toutes les tâches d'abord</button>`}
    <button class="btn btn-back" onclick="backToGarage()">← Retour au garage</button>`;
}
function renderShop() {
  $('shop-list').innerHTML = state.shop.map(item => `
    <div class="shop-item"><div><div class="shop-name">${item.name}</div><div class="shop-meta">${item.price} € · Stock : ${item.owned}</div></div>
    <button class="shop-btn" onclick="buyPart('${item.id}')">Acheter</button></div>`).join('');
}

// ==============================
// ACTIONS
// ==============================
function accepterClient(clientId) {
  if (state.motos.length >= state.maxCapacity) { toast('⚠️ Atelier plein !'); return; }
  const idx = state.clientsDisponibles.findIndex(c => c.id === clientId);
  if (idx === -1) return;
  const client = state.clientsDisponibles[idx];
  state.motos.push(client);
  state.clientsDisponibles.splice(idx, 1, genererClient());
  updateHeader();
  renderClients();
  toast('✅ ' + client.name + ' acceptée !');
}

function completeMoto(motoId) {
  const moto = state.motos.find(m => m.id === motoId);
  if (!moto) return;
  state.money += moto.reward;
  state.done += 1;
  state.reputation = Math.min(5, parseFloat((state.reputation + 0.05).toFixed(2)));
  state.motos = state.motos.filter(m => m.id !== motoId);
  updateHeader();
  $('reward-title').textContent = '🎉 ' + moto.name + ' rendue !';
  $('reward-sub').textContent = '+' + moto.reward + ' € · Réputation : ⭐ ' + state.reputation;
  $('reward-banner').style.display = 'block';
  $('repair-content').innerHTML = `
    <div class="success-screen">
      <div class="success-icon">🏆</div>
      <div class="success-title">Réparation terminée !</div>
      <div class="success-sub">La ${moto.name} est rendue à ${moto.client} !</div>
      <button class="btn btn-primary" style="max-width:240px;margin:0 auto" onclick="backToGarage()">Retour au garage</button>
    </div>`;
}

function buyPart(id) {
  const item = state.shop.find(s => s.id === id);
  if (!item) return;
  if (state.money < item.price) { toast('💸 Pas assez d\'argent !'); return; }
  state.money -= item.price;
  item.owned += 1;
  updateHeader(); renderShop();
  toast('✓ ' + item.name + ' achetée !');
}

function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => el.style.opacity = '0', 2200);
}

// ==============================
// MINI-JEUX
// ==============================
function startMinigame(motoId, repairId) {
  const moto = state.motos.find(m => m.id === motoId);
  const repair = moto.repairs.find(r => r.id === repairId);
  if (!repair || repair.done) return;
  if (state.money < repair.price) { toast('💸 Pas assez d\'argent !'); return; }

  currentMinigame = { motoId, repairId, repair };
  const type = MINIGAME_TYPES[repairId] || 'timing';

  if (type === 'timing') showMinigameTiming(repair);
  else if (type === 'find') showMinigameFind(repair);
  else showMinigameOrder(repair);
}

function closeMinigame() {
  $('minigame-overlay').style.display = 'none';
  if (currentMinigame && currentMinigame.timerId) {
    clearInterval(currentMinigame.timerId);
  }
  currentMinigame = null;
}

function onMinigameSuccess() {
  const { motoId, repairId, repair } = currentMinigame;
  state.money -= repair.price;
  const moto = state.motos.find(m => m.id === motoId);
  moto.repairs.find(r => r.id === repairId).done = true;
  updateHeader();
  setTimeout(() => {
    closeMinigame();
    renderRepair(moto);
    toast('✓ ' + repair.name + ' effectué !');
  }, 900);
}

// ----- Mini-jeu 1 : TIMING -----
function showMinigameTiming(repair) {
  const box = $('minigame-box');
  box.innerHTML = `
    <div class="mg-title">⏱️ Timing parfait</div>
    <div class="mg-sub">${repair.name} — Appuie quand le curseur est dans la zone verte !</div>
    <div class="timing-bar-wrap" id="timing-bar" onclick="checkTiming()">
      <div class="timing-zone" id="timing-zone"></div>
      <div class="timing-cursor" id="timing-cursor"></div>
    </div>
    <div class="mg-result" id="mg-result"></div>
    <button class="timing-tap-btn" onclick="checkTiming()">👊 TAPER !</button>
  `;
  $('minigame-overlay').style.display = 'flex';

  // Zone verte aléatoire (entre 20% et 65% de largeur)
  const zoneStart = randInt(15, 55);
  const zoneWidth = randInt(18, 28);
  const zone = $('timing-zone');
  zone.style.left = zoneStart + '%';
  zone.style.width = zoneWidth + '%';

  // Curseur qui se déplace
  let pos = 0;
  let dir = 1;
  const speed = randInt(8, 14) / 10; // px par frame
  currentMinigame.timerId = setInterval(() => {
    pos += dir * speed;
    if (pos >= 100) { pos = 100; dir = -1; }
    if (pos <= 0) { pos = 0; dir = 1; }
    const cursor = $('timing-cursor');
    if (cursor) cursor.style.left = pos + '%';
    else clearInterval(currentMinigame.timerId);
  }, 16);

  currentMinigame.zoneStart = zoneStart;
  currentMinigame.zoneEnd = zoneStart + zoneWidth;
  currentMinigame.getPos = () => pos;
  currentMinigame.checked = false;
}

function checkTiming() {
  if (!currentMinigame || currentMinigame.checked) return;
  currentMinigame.checked = true;
  clearInterval(currentMinigame.timerId);
  const pos = currentMinigame.getPos();
  const result = $('mg-result');
  if (pos >= currentMinigame.zoneStart && pos <= currentMinigame.zoneEnd) {
    result.textContent = '🎯 Parfait ! Bien joué !';
    result.className = 'mg-result success';
    onMinigameSuccess();
  } else {
    result.textContent = '❌ Raté ! Réessaie…';
    result.className = 'mg-result fail';
    setTimeout(() => {
      currentMinigame.checked = false;
      // Relancer
      let pos2 = 0, dir2 = 1;
      const speed2 = randInt(8,14)/10;
      currentMinigame.getPos = () => pos2;
      currentMinigame.timerId = setInterval(() => {
        pos2 += dir2 * speed2;
        if (pos2 >= 100) { pos2 = 100; dir2 = -1; }
        if (pos2 <= 0) { pos2 = 0; dir2 = 1; }
        const cursor = $('timing-cursor');
        if (cursor) cursor.style.left = pos2 + '%';
        else clearInterval(currentMinigame.timerId);
      }, 16);
      if (result) { result.textContent = ''; result.className = 'mg-result'; }
    }, 1200);
  }
}

// ----- Mini-jeu 2 : TROUVER LA PIÈCE -----
const PIECES_DATA = [
  {id:"carbu", emoji:"⚙️", label:"Carburateur"},
  {id:"bat", emoji:"🔋", label:"Batterie"},
  {id:"frein", emoji:"🛑", label:"Plaquette frein"},
  {id:"pneu", emoji:"⭕", label:"Pneu"},
  {id:"filtre", emoji:"🌀", label:"Filtre à air"},
  {id:"bougies", emoji:"⚡", label:"Bougie"},
  {id:"phare", emoji:"💡", label:"Phare"},
  {id:"retro", emoji:"🪞", label:"Rétroviseur"},
  {id:"liquide", emoji:"💧", label:"Liquide refroid."},
  {id:"fusible", emoji:"🔌", label:"Fusible"},
  {id:"huile", emoji:"🛢️", label:"Joint d'huile"},
];

function showMinigameFind(repair) {
  // Trouver la bonne pièce parmi 4 options
  const correct = PIECES_DATA.find(p => p.id === repair.id) || PIECES_DATA[0];
  // 3 mauvaises réponses aléatoires
  const wrong = PIECES_DATA.filter(p => p.id !== correct.id);
  const options = [correct];
  while (options.length < 4) {
    const w = rand(wrong);
    if (!options.find(o => o.id === w.id)) options.push(w);
  }
  // Mélanger
  options.sort(() => Math.random() - 0.5);

  const box = $('minigame-box');
  box.innerHTML = `
    <div class="mg-title">🔍 Trouve la pièce</div>
    <div class="mg-sub">Sélectionne la bonne pièce pour : <b>${repair.name}</b></div>
    <div class="parts-grid" id="parts-grid">
      ${options.map(o => `
        <div class="part-option" onclick="checkFind('${o.id}','${correct.id}', this)">
          <div class="part-emoji">${o.emoji}</div>
          <div>${o.label}</div>
        </div>`).join('')}
    </div>
    <div class="mg-result" id="mg-result"></div>
    <button class="btn btn-back" style="margin-top:8px" onclick="closeMinigame()">Annuler</button>
  `;
  $('minigame-overlay').style.display = 'flex';
}

function checkFind(chosen, correct, el) {
  const result = $('mg-result');
  // Désactiver tous les choix
  document.querySelectorAll('.part-option').forEach(p => p.onclick = null);
  if (chosen === correct) {
    el.classList.add('correct');
    result.textContent = '🎯 Bonne pièce !';
    result.className = 'mg-result success';
    onMinigameSuccess();
  } else {
    el.classList.add('wrong');
    // Montrer la bonne
    document.querySelectorAll('.part-option').forEach(p => {
      if (p.querySelector('div:last-child') && p.innerHTML.includes(correct)) p.classList.add('correct');
    });
    result.textContent = '❌ Mauvaise pièce ! Réessaie dans 2s…';
    result.className = 'mg-result fail';
    setTimeout(() => showMinigameFind(currentMinigame.repair), 2000);
  }
}

// ----- Mini-jeu 3 : ORDRE -----
const ORDRE_DATA = {
  "frein":    ["Retirer la roue","Démonter l'étrier","Insérer les plaquettes","Remonter l'étrier","Remettre la roue"],
  "bougies":  ["Couper le contact","Déconnecter les câbles","Dévisser les bougies","Visser les nouvelles bougies","Reconnecter les câbles"],
  "chaine":   ["Placer la moto sur béquille","Détendre la chaîne","Retirer l'ancienne chaîne","Poser la nouvelle chaîne","Régler la tension"],
  "boite":    ["Vidanger l'huile de boîte","Déposer le couvercle","Inspecter les engrenages","Remonter le couvercle","Remplir d'huile neuve"],
  "amortis":  ["Soulever la moto","Retirer les roues","Démonter les amortisseurs","Monter les neufs","Remettre les roues"],
  "carross":  ["Démonter les pièces","Redresser le métal","Poncer la surface","Apprêter","Peindre"],
  "joint_cul":["Vidanger le liquide","Déposer le moteur","Retirer la culasse","Changer le joint","Remonter la culasse"],
  "order_def":["Étape 1","Étape 2","Étape 3","Étape 4"],
};

function showMinigameOrder(repair) {
  const steps = ORDRE_DATA[repair.id] || ORDRE_DATA["order_def"];
  // Mélanger les étapes
  const shuffled = [...steps].sort(() => Math.random() - 0.5);

  currentMinigame.orderSteps = steps;
  currentMinigame.orderAnswer = [];

  const box = $('minigame-box');
  box.innerHTML = `
    <div class="mg-title">📋 Dans le bon ordre</div>
    <div class="mg-sub">${repair.name} — Mets les étapes dans le bon ordre !</div>
    <div class="order-pieces" id="order-pieces">
      ${shuffled.map((s,i) => `<button class="order-piece" id="piece-${i}" onclick="pickOrderPiece(${i},'${s.replace(/'/g,"\\'")}',this)">${s}</button>`).join('')}
    </div>
    <div style="font-size:12px;color:var(--text2);margin-bottom:6px;text-align:left">Clique dans l'ordre :</div>
    <div class="order-slots" id="order-slots">
      ${steps.map((_,i) => `<div class="order-slot" id="slot-${i}">${i+1}.</div>`).join('')}
    </div>
    <div class="mg-result" id="mg-result"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-back" style="flex:1;margin:0" onclick="resetOrder()">🔄 Reset</button>
      <button class="btn btn-back" style="flex:1;margin:0" onclick="closeMinigame()">Annuler</button>
    </div>
  `;
  $('minigame-overlay').style.display = 'flex';
}

function pickOrderPiece(idx, text, btn) {
  const answer = currentMinigame.orderAnswer;
  const steps = currentMinigame.orderSteps;
  answer.push(text);
  btn.disabled = true;

  const slotIdx = answer.length - 1;
  const slot = $('slot-' + slotIdx);
  if (slot) { slot.textContent = (slotIdx+1) + '. ' + text; slot.classList.add('filled'); }

  // Vérifier si complet
  if (answer.length === steps.length) {
    const correct = answer.every((a, i) => a === steps[i]);
    const result = $('mg-result');
    if (correct) {
      document.querySelectorAll('.order-slot').forEach(s => s.classList.add('correct-slot'));
      result.textContent = '🎯 Parfait ! Bon ordre !';
      result.className = 'mg-result success';
      onMinigameSuccess();
    } else {
      document.querySelectorAll('.order-slot').forEach((s, i) => {
        s.classList.add(answer[i] === steps[i] ? 'correct-slot' : 'wrong-slot');
      });
      result.textContent = '❌ Pas le bon ordre ! Réessaie…';
      result.className = 'mg-result fail';
      setTimeout(() => showMinigameOrder(currentMinigame.repair), 2000);
    }
  }
}

function resetOrder() {
  currentMinigame.orderAnswer = [];
  showMinigameOrder(currentMinigame.repair);
}

// ==============================
// DÉMARRAGE
// ==============================
refreshClients();
updateHeader();
renderGarage();
</script>
